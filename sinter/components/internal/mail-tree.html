<!--
  mail-tree: <mail-body>'s template rendering, the body through the generated components (internal). <mail-body>
  renders it where the build knows the body (a file: email, written into the page with no script) or where a use
  fills `link` or `image`; elsewhere <mail-view>'s script builds the same elements.
-->
<template data-sn-props="{ body?: Body | null; link: Slot<{ node: Element }>; image: Slot<{ node: Element }> }"><div class="mail" data-sn-class="{ 'mail-light': !!body?.light }" data-sn-state="{ shown: null }" data-sn-style="{ display: body ? 'flow-root' : null, color: body?.style.color, 'font-family': body?.style['font-family'], 'font-size': body?.style['font-size'], 'font-style': body?.style['font-style'], 'font-weight': body?.style['font-weight'], 'font-variant': body?.style['font-variant'], 'line-height': body?.style['line-height'], 'letter-spacing': body?.style['letter-spacing'], 'word-spacing': body?.style['word-spacing'], 'text-align': body?.style['text-align'], 'text-decoration': body?.style['text-decoration'], 'text-transform': body?.style['text-transform'], 'text-indent': body?.style['text-indent'], 'white-space': body?.style['white-space'], 'word-break': body?.style['word-break'], 'overflow-wrap': body?.style['overflow-wrap'], 'background-color': body?.style['background-color'] }"><template data-sn-if="body && body.head"><template data-sn-for="(c, ci) in shown ? shown.children : []" data-sn-key="c.n ?? ci"><template data-sn-if="c.type === 'text'"><template data-sn-text="c.value"></template></template><template data-sn-else><template data-sn-if="c.style.display !== 'none'"><mail-node data-sn-with="{ node: c }"></mail-node></template></template></template><mail-steps data-sn-with="{ body }" data-sn-on-step="shown = $event.detail"></mail-steps></template><template data-sn-else><template data-sn-for="(c, ci) in body ? body.children : []" data-sn-key="c.n ?? ci"><template data-sn-if="c.type === 'text'"><template data-sn-text="c.value"></template></template><template data-sn-else><template data-sn-if="c.style.display !== 'none'"><mail-node data-sn-with="{ node: c }"></mail-node></template></template></template></template></div></template>
