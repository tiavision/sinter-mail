<!--
  mail-body: one email body, HTML or plain text. Public.
  <mail-body data-sn-with="{ body }"></mail-body>, `body` from mail.parse or mail.plain (or an API that
  runs the parse on the server and sends the tree as JSON).
  Its root is a plain <div class="mail">, so the tag may carry an id or a class. It carries the body's own
  style (its text properties and background-color) and `display: flow-root`, so the email's floats and
  margins stay inside its box. `display` depends on the body on purpose: the build writes a constant style
  into the HTML as a style attribute, which `style-src 'self'` blocks, while one that depends on data is set
  in the browser with style.setProperty, which the policy allows. With no body (a lazy parser that has not
  arrived) it is an empty <div class="mail">.
  A body that mail.progressive numbered (`body.head`) renders progressively: its first part in the task that
  receives it, the rest in steps after the browser has painted that, a task each, sized to about 12 ms (mail-steps emits each step's
  tree; only the elements a step cuts are copies, and rows are keyed by the nodes' numbers, so a step renders that
  path and its new rows). Any other body renders whole in one task, and a static page's (an email from a file)
  folds at build time with no JavaScript: the progressive branch, which has the script, is decided away.
  The slots below are the library's whole contract: `link` replaces every <a> of the email, `image` every
  <img>, each fill reading the element as $slot.node (its attrs, style and, for a link, children through
  <slot></slot>). Without a fill a link opens in a new tab (rel="noopener noreferrer"); an image is a plain
  <img> that keeps its box when the parse left its src out.
  An email written for a white page (`body.light`: colours of its own, nothing saying they work on a dark one) puts
  `mail-light` on the root, for the app's dark mode: mail.css gives it a light canvas.
-->
<template data-sn-props="{ body?: Body | null; templates?: boolean; link: Slot<{ node: Element }>; image: Slot<{ node: Element }> }"><template data-sn-if="($build && (!!body || !body)) || $slots.link || $slots.image || !!templates"><mail-tree data-sn-with="{ body }"></mail-tree></template><template data-sn-else><mail-view data-sn-with="{ body }"></mail-view></template></template>
