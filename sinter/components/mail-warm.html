<!--
  mail-warm (public, opt-in): <mail-warm></mail-warm> on a page that will parse an email in the browser: while the page
  waits for its first email, its script (mail-warm.ts) parses and builds sample emails in idle time, so the browser has
  compiled and optimised the parser before the real email arrives. Its root is an empty hidden element.
-->
<template data-sn-emits="{ sample: Body }"><i hidden></i></template>
